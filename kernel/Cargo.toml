[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
authors = ["Torexto"]

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
bootloader_api = "0.11.17"
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
uart_16550 = "0.8.1"
x86_64 = "0.15.2"
lazy_static = { version = "1.5.0", default-features = false, features = ["spin_no_std"] }
spin = "0.12.3"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"